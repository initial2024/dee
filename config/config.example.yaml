mode: AUTO_TRIAD
api:
  base_url_env: XIAOYU_CODER_API_BASE
  model_env: optional-preferred-model-env
  api_key_env: XIAOYU_CODER_API_KEY
  wire_api: chat_completions
  requires_bearer_auth: true
  header_env: {} # map header names to environment-variable names; never store values here
  max_requests_per_task: 3
  max_tokens_per_task: 12000
  max_cost_usd_per_task: 2.00
local:
  base_url: http://127.0.0.1:1234/v1
  model: auto
  direct_backend: llama_cpp
  direct_endpoint: http://127.0.0.1:18790/v1
  lmstudio_fallback_only: true
  first_token_budget_seconds: 8
  simple_task_budget_seconds: 20
  hard_timeout_seconds: 30
  max_agent_steps: 2
  structured_retry_max: 1
  local_write: false
  auto_select_model: true
  allow_slow_local: false
  allow_bf16_auto: false
routing:
  codex_budget_mode: SAVE
  max_agent_iterations: 6
  max_wall_time_seconds: 300
  max_tool_calls: 40
  max_output_bytes: 65536
provider_policy:
  allow: [local, api]
  deny: []
models:
  allow: []
  deny: []
roles:
  coder:
    preferred: [api:model-code, local:model-local]
